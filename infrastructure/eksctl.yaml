# Template renderizado por scripts/setup.sh (variáveis ${...} vêm de scripts/lib/common.sh).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: ${AWS_REGION}
  version: "${K8S_VERSION}"
  tags:
    workshop: kubernetes-reliability
    owner: ${WORKSHOP_OWNER}

# VPC criada antes do cluster por infrastructure/vpc/vpc.sh (plano 10.201-10.240.0.0/16, um por aluno; o eksctl não a remove).
vpc:
  id: ${VPC_ID}
  subnets:
    public:
      public-a: {id: ${PUBLIC_SUBNET_A}}
      public-b: {id: ${PUBLIC_SUBNET_B}}
    private:
      private-a: {id: ${PRIVATE_SUBNET_A}}
      private-b: {id: ${PRIVATE_SUBNET_B}}
  # ENIs do control plane nas subnets PÚBLICAS; os nós ficam nas privadas (privateNetworking abaixo).
  controlPlaneSubnetIDs: [${PUBLIC_SUBNET_A}, ${PUBLIC_SUBNET_B}]
  clusterEndpoints:
    publicAccess: true    # kubectl dos alunos/pipeline
    privateAccess: true   # nós falam com a API sem sair da VPC

iam:
  withOIDC: false   # usamos EKS Pod Identity (não IRSA)
  podIdentityAssociations:
    - namespace: kube-system
      serviceAccountName: cluster-autoscaler
      roleName: ${CLUSTER_NAME}-cluster-autoscaler
      wellKnownPolicies:
        autoScaler: true

addonsConfig:
  autoApplyPodIdentityAssociations: true

addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy": "true"}'
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
  - name: metrics-server            # EKS community add-on (base do HPA)
  - name: aws-ebs-csi-driver        # volumes do ClickHouse/MongoDB
    podIdentityAssociations:
      - serviceAccountName: ebs-csi-controller-sa
        namespace: kube-system
        permissionPolicyARNs:
          - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

managedNodeGroups:
  # Workloads do laboratório. Escala via Cluster Autoscaler (2..5 nós).
  - name: apps
    instanceType: ${APPS_INSTANCE_TYPE}
    minSize: 2
    desiredCapacity: 2
    maxSize: 5
    volumeSize: 30
    volumeType: gp3
    privateNetworking: true
    labels: {workload: apps}
    disableIMDSv1: true
    disablePodIMDS: true      # hop limit = 1: Pods não alcançam o IMDS (credenciais do nó)
    propagateASGTags: true
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/${CLUSTER_NAME}: "owned"
      k8s.io/cluster-autoscaler/node-template/label/workload: apps

  # Plano de observabilidade ISOLADO (taint): experimentos de pressão não o afetam.
  - name: observability
    instanceType: ${OBS_INSTANCE_TYPE}
    minSize: 1
    desiredCapacity: 1
    maxSize: 1
    volumeSize: 50
    volumeType: gp3
    privateNetworking: true
    labels: {workload: observability}
    taints:
      - key: workload
        value: observability
        effect: NoSchedule
    disableIMDSv1: true
    disablePodIMDS: true

cloudWatch:
  clusterLogging:
    enableTypes: []   # sem custo de CloudWatch Logs no workshop
