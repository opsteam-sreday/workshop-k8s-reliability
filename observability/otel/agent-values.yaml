# OpenTelemetry Collector AGENT (DaemonSet) — um por nó.
#
# - kubeletstats: CPU/memória por Pod/container, utilização vs requests/limits.
# - filelog: logs de containers dos demais namespaces (kube-system => Cluster Autoscaler etc.).
#   O namespace `ecommerce` é EXCLUÍDO: as APIs já enviam logs via OTLP (evita duplicidade).
# Exporta via OTLP para o gateway (que concentra a autenticação no ClickStack).
mode: daemonset
fullnameOverride: otel-agent
image:
  repository: otel/opentelemetry-collector-k8s
tolerations:
  - {operator: Exists}     # coleta também do nó de observabilidade
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}

presets:
  kubeletMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
  logsCollection:
    enabled: true

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp: null
    kubeletstats:
      collection_interval: 15s
      insecure_skip_verify: true   # certificado de serving do kubelet não é assinado por CA confiável no Pod
      metric_groups: [node, pod, container]
      metrics:
        k8s.container.cpu_limit_utilization: {enabled: true}
        k8s.container.cpu_request_utilization: {enabled: true}
        k8s.container.memory_limit_utilization: {enabled: true}
        k8s.container.memory_request_utilization: {enabled: true}
        k8s.pod.cpu_limit_utilization: {enabled: true}
        k8s.pod.cpu_request_utilization: {enabled: true}
        k8s.pod.memory_limit_utilization: {enabled: true}
        k8s.pod.memory_request_utilization: {enabled: true}
    filelog:
      exclude:
        - /var/log/pods/observability_otel-agent*_*/opentelemetry-collector/*.log
        - /var/log/pods/ecommerce_*/*/*.log
  exporters:
    debug: null
    otlp/gateway:
      endpoint: otel-gateway.observability.svc.cluster.local:4317
      tls: {insecure: true}
  service:
    pipelines:
      traces: null
      metrics:
        receivers: [kubeletstats]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/gateway]
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/gateway]
