# StorageClass padrão gp3 (EBS CSI) para os volumes do ClickHouse, Keeper e MongoDB.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete       # teardown remove os PVCs => volumes EBS são apagados
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
