# Receptor de webhooks do LAB 05 (namespace observability). O código está em
# observability/alerts/webhook/receiver.py e é montado via ConfigMap (gerado pelo setup.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: observability
  labels: {app.kubernetes.io/name: alert-webhook, app.kubernetes.io/part-of: reliability-workshop}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alert-webhook}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alert-webhook}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {workload: observability}
      tolerations:
        - {key: workload, operator: Equal, value: observability, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: receiver
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["python", "/app/receiver.py"]
          env: [{name: PORT, value: "8080"}, {name: PYTHONUNBUFFERED, value: "1"}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: code, mountPath: /app}]
      volumes:
        - name: code
          configMap: {name: alert-webhook-code}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: observability
spec:
  selector: {app.kubernetes.io/name: alert-webhook}
  ports: [{name: http, port: 8080, targetPort: http}]
