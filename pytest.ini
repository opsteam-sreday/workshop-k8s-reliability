[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = apps/orders-api/tests apps/inventory-api/tests apps/bff-api/tests tests/integration
markers =
    integration: testes que iniciam processos reais (DynamoDB Local/moto server + 3 APIs)
addopts = -p no:cacheprovider --import-mode=importlib
