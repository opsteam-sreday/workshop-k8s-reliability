# Turma inteira: build único das imagens + um workshop-up por aluno, em paralelo (equivale a `make fleet-up`).
# Cada aluno vira um job da matrix (log próprio; falhou? "Re-run failed jobs" refaz só ele). Um aluno só:
# workshop-up (Actions) ou `make student-up CLUSTER_ID=<id>` (local).
# Antes: `make fleet-quotas` (VPCs, EIPs, NAT por AZ, vCPU, clusters) e `make identity-center` (usuários SSO).
name: fleet-up

on:
  workflow_dispatch:
    inputs:
      students:
        description: "Alunos como id:username, separados por espaço ou vírgula (ex.: aluno01:bruno@ops.team aluno02:ana@ops.team). Sem :username = sem role de aluno"
        required: true
      aws_region:
        description: Região AWS
        default: us-east-1
        required: true
      max_parallel:
        description: Ambientes provisionados ao mesmo tempo
        default: "8"
        required: true
      validate:
        description: Executar scripts/validate.sh em cada ambiente
        type: boolean
        default: true

permissions:
  id-token: write   # repassado aos workflows chamados (OIDC)
  contents: read

jobs:
  plan:
    name: 1. Validar a lista de alunos
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - id: parse
        env:
          STUDENTS: ${{ inputs.students }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          rows, seen, errors = [], set(), []
          for item in re.split(r"[\s,]+", os.environ["STUDENTS"].strip()):
              if not item:
                  continue
              sid, _, username = item.partition(":")
              # Mesmas regras de scripts/lib/common.sh (ID) e do plano de VPCs (aluno01..aluno40).
              if not re.fullmatch(r"[a-z0-9]{1,16}", sid) or not re.fullmatch(r"[a-z]*0*([1-9]|[1-3][0-9]|40)", sid):
                  errors.append(f"ID inválido ou fora do plano de VPCs: {sid!r}")
              elif sid in seen:
                  errors.append(f"ID repetido: {sid}")
              elif username and not re.fullmatch(r"[^\s:,]+", username):
                  errors.append(f"username inválido para {sid}: {username!r}")
              else:
                  seen.add(sid)
                  rows.append({"cluster_id": sid, "username": username})
          if errors or not rows:
              print("\n".join(f"::error::{e}" for e in errors or ["nenhum aluno informado"]))
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(rows)}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Turma: {len(rows)} ambientes\n\n| Aluno | Cluster | Username |\n|---|---|---|\n")
              summary.writelines(f"| {r['cluster_id']} | rw-{r['cluster_id']} | {r['username'] or '—'} |\n" for r in rows)
          PY

  images:
    name: 2. Imagens (build único)
    needs: plan
    uses: ./.github/workflows/images.yml
    with:
      aws_region: ${{ inputs.aws_region }}

  student:
    name: 3. rw-${{ matrix.cluster_id }}
    needs: [plan, images]
    strategy:
      fail-fast: false            # um aluno com falha não interrompe os outros
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/workshop-up.yml
    with:
      aws_region: ${{ inputs.aws_region }}
      cluster_id: ${{ matrix.cluster_id }}
      student_username: ${{ matrix.username }}
      validate: ${{ inputs.validate }}
      skip_images: true
