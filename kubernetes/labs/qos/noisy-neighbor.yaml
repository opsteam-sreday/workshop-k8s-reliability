# Vizinho barulhento BestEffort para o LAB 05: consome CPU no MESMO nó da Inventory API.
# Carga limitada: 2 processos `yes` e encerramento automático após 10 minutos.
apiVersion: v1
kind: Pod
metadata:
  name: noisy-neighbor
  namespace: loadtest
  labels: {app.kubernetes.io/name: noisy-neighbor, app.kubernetes.io/part-of: reliability-workshop}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 600
  nodeSelector: {workload: apps}
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector: {matchLabels: {app.kubernetes.io/name: inventory-api}}
          namespaces: [ecommerce]
          topologyKey: kubernetes.io/hostname
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: burn
      image: public.ecr.aws/docker/library/busybox:1.37
      command: ["sh", "-c", "yes > /dev/null & yes > /dev/null & wait"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
