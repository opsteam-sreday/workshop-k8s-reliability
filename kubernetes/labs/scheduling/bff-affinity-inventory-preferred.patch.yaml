# LAB 07 D1 — podAffinity PREFERRED: BFF "de preferência" no nó da Inventory (réplica única). O topology spread
# (DoNotSchedule) é filtro e vence a preferência: as 2 réplicas continuam 1 por nó.
spec:
  template:
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: inventory-api}}
