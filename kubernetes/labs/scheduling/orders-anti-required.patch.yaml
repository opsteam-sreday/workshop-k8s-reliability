# LAB 07 B2 — podAntiAffinity REQUIRED por nó, contando só o ReplicaSet atual (matchLabelKeys): no máximo 1
# réplica da Orders por nó. Rollouts funcionam; a 3ª réplica com 2 nós fica Pending.
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app.kubernetes.io/name: orders-api}}
              matchLabelKeys: [pod-template-hash]
