apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: ecommerce
  labels: {app.kubernetes.io/name: inventory-api, app.kubernetes.io/part-of: reliability-workshop}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: inventory-api}
  strategy:
    type: Recreate   # réplica única com estado em memória (MVP)
  template:
    metadata:
      labels: {app.kubernetes.io/name: inventory-api, app.kubernetes.io/part-of: reliability-workshop}
    spec:
      serviceAccountName: inventory-api-sa
      automountServiceAccountToken: false
      # Dependência transacional da Orders API: mesma prioridade do caminho crítico.
      # Sem PriorityClass (prioridade 0), o scale-out da Orders (1000) PREEMPTA a Inventory —
      # comportamento observado na validação real do LAB 02. O LAB 03 aplica o anti-pattern
      # (low-priority-services) de propósito.
      priorityClassName: critical-services
      terminationGracePeriodSeconds: 30
      nodeSelector: {workload: apps}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: inventory-api
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: otel-config}
            - configMapRef: {name: inventory-config}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: OTEL_SERVICE_NAME, value: inventory-api}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=inventory-api
          # Perfil Burstable (padrão). Perfis alternativos em kubernetes/labs/qos/.
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
