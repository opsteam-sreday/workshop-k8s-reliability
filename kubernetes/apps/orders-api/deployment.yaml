apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: ecommerce
  labels: {app.kubernetes.io/name: orders-api, app.kubernetes.io/part-of: reliability-workshop}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: orders-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orders-api, app.kubernetes.io/part-of: reliability-workshop}
    spec:
      serviceAccountName: orders-api-sa
      automountServiceAccountToken: false
      priorityClassName: critical-services
      terminationGracePeriodSeconds: 30
      nodeSelector: {workload: apps}
      # No máximo 1 réplica de diferença entre os nós apps: perder um nó não leva todas as réplicas (LAB 05, parte E).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule        # regra rígida: prefere Pending a empilhar réplicas num nó
          labelSelector: {matchLabels: {app.kubernetes.io/name: orders-api}}
          matchLabelKeys: [pod-template-hash]     # só o ReplicaSet atual conta (rollouts não desequilibram)
          nodeTaintsPolicy: Honor                 # nós com taint (observability, cordon) não contam como domínio
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: orders-api
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: otel-config}
            - configMapRef: {name: orders-config}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: OTEL_SERVICE_NAME, value: orders-api}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=orders-api
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 384Mi}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
