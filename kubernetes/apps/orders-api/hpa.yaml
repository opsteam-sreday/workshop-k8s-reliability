# HPA da Orders API baseado em CPU.
# Utilização = uso real de CPU / requests.cpu (250m). Sem requests, o HPA não calcula utilização.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-api
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-api
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
        - {type: Pods, value: 4, periodSeconds: 15}
    scaleDown:
      stabilizationWindowSeconds: 120   # workshop: 2 min (padrão do Kubernetes: 300s)
      selectPolicy: Min
      policies:
        - {type: Percent, value: 50, periodSeconds: 30}
