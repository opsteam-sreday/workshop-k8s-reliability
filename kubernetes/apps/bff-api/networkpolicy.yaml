apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bff-api-ingress, namespace: ecommerce}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: bff-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: loadtest}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecommerce}}
      ports: [{port: 8080, protocol: TCP}]
