# Cada API possui sua própria ServiceAccount. SOMENTE orders-api-sa recebe uma
# Pod Identity Association (IAM Role com acesso ao DynamoDB) — ver infrastructure/pod-identity.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff-api-sa
  namespace: ecommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api-sa
  namespace: ecommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-api-sa
  namespace: ecommerce
automountServiceAccountToken: false
