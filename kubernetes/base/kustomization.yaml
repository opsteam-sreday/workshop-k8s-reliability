# Estado desejado completo do workshop: plataforma compartilhada + uma pasta por aplicação.
# As imagens (ECR) e valores específicos da conta são definidos pelo overlay gerado
# em kubernetes/overlays/generated/ pelo scripts/deploy.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../platform
  - ../apps/bff-api
  - ../apps/orders-api
  - ../apps/inventory-api
