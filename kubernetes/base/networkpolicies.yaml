# Requer VPC CNI com enableNetworkPolicy=true (configurado em infrastructure/eksctl.yaml).
# Ingress: default deny + somente os fluxos da arquitetura (k6 -> BFF -> Orders -> Inventory).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: ecommerce}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bff-api-ingress, namespace: ecommerce}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: bff-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: loadtest}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecommerce}}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: orders-api-ingress, namespace: ecommerce}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: orders-api}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: bff-api}}}]
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: inventory-api-ingress, namespace: ecommerce}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: inventory-api}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: orders-api}}}]
      ports: [{port: 8080, protocol: TCP}]
---
# Egress: tudo permitido EXCETO o IMDS dos nós (169.254.169.254). Defesa em profundidade
# junto com httpPutResponseHopLimit=1 (disablePodIMDS). O Pod Identity Agent usa
# 169.254.170.23 e continua acessível.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deny-node-imds-egress, namespace: ecommerce}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
